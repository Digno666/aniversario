<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Feliz aniversario, mi amor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#241a45;--ink:#fff0f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;left:0;right:0;bottom:0;text-align:center;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));color:var(--ink);font-family:'Dancing Script',cursive,serif;pointer-events:none}
h1{margin:0;font-size:clamp(34px,8.5vw,72px);line-height:1.1;font-weight:600;text-shadow:0 0 22px #ffb3d1,0 0 56px #d9c2ff}
input{pointer-events:auto;margin-top:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,180,210,.4);color:var(--ink);border-radius:999px;padding:8px 16px;font:16px system-ui,sans-serif;text-align:center;outline:none;width:min(260px,70vw)}
input:focus-visible{border-color:#ff8fa3;box-shadow:0 0 0 3px rgba(255,77,141,.35)}
input::placeholder{color:rgba(255,227,236,.55)}

.hint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:rgba(255,227,236,.7);font:14px system-ui,sans-serif;pointer-events:none}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(36,26,69,.72);backdrop-filter:blur(6px);z-index:5}
.modal.on{display:flex}
.card{width:min(380px,100%);background:#2e2356;border:1px solid rgba(255,190,220,.55);border-radius:22px;padding:16px 16px 20px;text-align:center;color:var(--ink);box-shadow:0 0 60px rgba(255,179,209,.35);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block}
.card h2{margin:14px 0 6px;font:600 34px 'Dancing Script',cursive,serif}
.card p{margin:0 0 16px;font:16px/1.5 system-ui,sans-serif;color:#f3dcf0}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid rgba(255,190,220,.5);background:rgba(255,255,255,.08);color:var(--ink);border-radius:999px;padding:8px 16px;font:14px system-ui,sans-serif;cursor:pointer}
.btn.main{background:#ffb3d1;border-color:#ffb3d1;color:#3a1a4a}
.btn:focus-visible{outline:2px solid #ffd6a5;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Toca las palabras que flotan en la galaxia 💖</div>
<div class="modal" id="m" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card">
<img id="mi" alt="">
<h2 id="mt"></h2><p id="mp"></p>
<div class="row"><button class="btn main" id="mc">Cerrar</button></div>
</div></div>
<div class="ui"><h1 id="t">Feliz aniversario, mi amor</h1></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,dpr;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
addEventListener('resize',size);size();
const pal=['#ffb3d1','#d9c2ff','#b8e6ff','#c9f2d9','#ffe0c2','#ffffff'],hp=['#ffb3d1','#ffc8dd','#ffd6e8','#e8d5ff','#ffe0c2'];
const P=[],R=Math.random;
// Corazón: puntos rellenos de la curva paramétrica
for(let i=0;i<3200;i++){
  const t=R()*6.2832,s=Math.sqrt(R())*(0.35+0.65*R()>0.5?1:1);
  const k=R()<0.35?1:Math.sqrt(R());
  const x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  P.push({h:1,x:x*k,y:y*k+1,z:(R()-.5)*7*k,c:hp[R()*5|0],s:R()*1.4+.5});
}
// Disco espiral alrededor del corazón
for(let i=0;i<4200;i++){
  const r=6+Math.pow(R(),1.4)*46,arm=(i%3)*2.094,a=r*.14+arm+(R()-.5)*.55;
  P.push({h:0,r,a,y:(R()-.5)*3*(1-r/60),c:pal[R()*6|0],s:R()*1.2+.4});
}
// Estrellas de fondo
const S=[];for(let i=0;i<220;i++)S.push({x:R(),y:R(),s:R()*1.3+.3,p:R()*6.28});
const WS=[
['Te amo','Eres la razón de mis mejores sonrisas. Te amo más de lo que cabe en esta galaxia.','img/foto1.jpeg'],
['Mi vida','Contigo todo tiene sentido. Gracias por ser mi lugar favorito.',''],
['Contigo', 'A tu lado, hasta los momentos más simples se vuelven especiales. Me encanta compartir mi vida contigo.',''],
['Siempre', 'Quiero seguir compartiendo mis días contigo, apoyarte, cuidarte y amarte hoy y siempre.',''],
['Mi cielo', 'Eres esa personita que alegra mis días y hace que mi mundo sea mucho más bonito.',''],
['Mi hogar', 'No importa dónde estemos, si estoy contigo, siento que estoy en casa. Tus abrazos son mi lugar favorito.',''],
['Mi estrella', 'Eres esa persona especial que llegó a mi vida para hacerla más bonita. Me encanta tenerte a mi lado.',''],
['Gracias', 'Gracias por cada sonrisa, cada abrazo y cada momento bonito. Gracias por estar en mi vida y hacerla más feliz.',''],
['Eres todo', 'Eres todo lo que quiero y todo lo que deseoo.','']
].map((d,i)=>({w:d[0],m:d[1],r:20+(i%3)*9+R()*4,a:i*0.7,y:(R()-.5)*14,img:d[2]||'',sx:0,sy:0,hw:40}));
function ph(i){const c=document.createElement('canvas');c.width=400;c.height=300;const q=c.getContext('2d');
const gr=q.createRadialGradient(200,150,10,200,150,260);gr.addColorStop(0,'#ffc8dd');gr.addColorStop(1,'#8f7bd1');q.fillStyle=gr;q.fillRect(0,0,400,300);
for(let k=0;k<60;k++){q.fillStyle='rgba(255,255,255,'+(R()*.8)+')';q.fillRect(R()*400,R()*300,2,2)}
q.font='120px serif';q.textAlign='center';q.textBaseline='middle';q.fillText('💖',200,150);return c.toDataURL()}
WS.forEach((w,i)=>{w.ph=ph(i);if(!w.img)w.img=w.ph});
let cur=null;
const M=document.getElementById('m'),MI=document.getElementById('mi');
function openW(w){cur=w;MI.onerror=()=>{MI.onerror=null;MI.src=w.ph};MI.src=w.img;MI.alt=w.w;document.getElementById('mt').textContent=w.w;document.getElementById('mp').textContent=w.m;M.classList.add('on');document.getElementById('mc').focus()}
function closeW(){M.classList.remove('on')}
document.getElementById('mc').onclick=closeW;
M.addEventListener('pointerdown',e=>{if(e.target===M)closeW()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeW()});
let mx=0,my=0,ay=0,boost=0,dn=null;
function mv(e){const p=e.touches?e.touches[0]:e;mx=p.clientX/innerWidth-.5;my=p.clientY/innerHeight-.5}
addEventListener('pointermove',mv);
cv.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{
  if(!dn||M.classList.contains('on'))return;
  if(Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>10){dn=null;return}
  dn=null;let best=null,bd=1e9;
  for(const w of WS){const d=Math.hypot(e.clientX*dpr-w.sx,e.clientY*dpr-w.sy);if(d<Math.max(36*dpr,w.hw)&&d<bd){bd=d;best=w}}
  if(best)openW(best);else boost=1;
});
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(ms){
  const time=ms/1000;
  g.globalCompositeOperation='source-over';
  g.fillStyle='rgba(36,26,69,.28)';g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';
  for(const s of S){g.globalAlpha=.35+.35*Math.sin(time*1.5+s.p);g.fillStyle='#fff';g.fillRect(s.x*W,s.y*H,s.s*dpr,s.s*dpr)}
  boost*=.95;
  ay+= (still?0:.004)+boost*.03+mx*.01;
  const ax=.35+my*.8,ca=Math.cos(ay),sa=Math.sin(ay),cx=Math.cos(ax),sx=Math.sin(ax);
  const sc=Math.min(W,H)/(window.innerWidth<600?70:60);
  const pulse=1+.05*Math.sin(time*2.2)+boost*.12;
  for(const p of P){
    let x,y,z;
    if(p.h){x=p.x*pulse;y=p.y*pulse;z=p.z}
    else{p.a+=.0035/(1+p.r*.05);x=Math.cos(p.a)*p.r;z=Math.sin(p.a)*p.r;y=p.y}
    let x1=x*ca+z*sa,z1=-x*sa+z*ca;
    let y1=y*cx-z1*sx,z2=y*sx+z1*cx;
    const f=60/(60+z2+30),px=W/2+x1*sc*f,py=H*.42+y1*sc*f;
    g.globalAlpha=Math.min(1,(p.h?.9:.7)*f*1.1);
    g.fillStyle=p.c;
    const d=p.s*f*dpr*(p.h?1.4:1);
    g.fillRect(px,py,d,d);
  }
  g.globalCompositeOperation='source-over';
  for(const w of WS){
    w.a+=.0035/(1+w.r*.05);
    const x=Math.cos(w.a)*w.r,z=Math.sin(w.a)*w.r,y=w.y+Math.sin(time+w.r)*1.2;
    const x1=x*ca+z*sa,z1=-x*sa+z*ca,y1=y*cx-z1*sx,z2=y*sx+z1*cx;
    const f=60/(60+z2+30);w.sx=W/2+x1*sc*f;w.sy=H*.42+y1*sc*f;
    const fs=Math.max(14,24*f*dpr/ (dpr>1?1:1)*(innerWidth<600?.75:1));
    g.font='600 '+fs+'px "Dancing Script",cursive,serif';g.textAlign='center';g.textBaseline='middle';
    w.hw=g.measureText(w.w).width/2+10*dpr;
    g.globalAlpha=Math.min(1,.45+.6*f*f);
    g.shadowColor='#ffb3d1';g.shadowBlur=14*dpr;g.fillStyle='#ffffff';
    g.fillText(w.w,w.sx,w.sy);g.shadowBlur=0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
